        body {

            background-color: #f9f9fb;

            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            font-weight: bold;

            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .lesson-card {
            padding: 20px 0;
            text-align: center;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        /* Active status for completed/working lessons */
        .lesson-card.active {
            border: 2px solid #5d5fef;
            color: #5d5fef;
            background-color: #fff;
        }
        .lesson-card.active:hover {
            background-color: #f0f1ff;
        }
        /* Locked status for files you haven't created yet */
        .lesson-card.locked {
            background-color: #f3f3f6;
            color: #d1d1d6;
            border: 2px solid transparent;
            pointer-events: none;
        }
    </style>
</head>
